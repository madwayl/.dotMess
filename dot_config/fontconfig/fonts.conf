<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hinting" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hintstyle" mode="assign">
            <const>hintfull</const>
        </edit>
        <edit name="rgba" mode="assign">
            <const>rgb</const>
        </edit>
        <edit name="autohint" mode="assign">
            <bool>false</bool>
        </edit>
        <edit name="lcdfilter" mode="assign">
            <const>lcddefault</const>
        </edit>
        <edit name="dpi" mode="assign">
            <double>102</double>
        </edit>
        <test name="weight" compare="more">
            <const>medium</const>
        </test>
    </match>
    <alias binding="strong">
        <family>serif</family>
        <prefer>
        <family>Maple Mono</family>
        <family>Symbols Nerd Font</family>
        <family>Noto Serif</family>
        <family>Noto Color Emoji</family>
        <family>Noto Emoji</family>
        <family>Material Symbols Rounded</family>
        <family>Material Symbols Outlined</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>sans-serif</family>
        <prefer>
        <family>Maple Mono</family>
        <family>Symbols Nerd Font</family>
        <family>Noto Sans</family>
        <family>Noto Color Emoji</family>
        <family>Noto Emoji</family>
        <family>Material Symbols Rounded</family>
        <family>Material Symbols Outlined</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>cursive</family>
        <prefer>
        <family>Maple Mono Italic</family>
        <family>Symbols Nerd Font</family>
        <family>Noto Sans</family>
        <family>Noto Color Emoji</family>
        <family>Noto Emoji</family>
        <family>Material Symbols Rounded</family>
        <family>Material Symbols Outlined</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>fantasy</family>
        <prefer>
        <family>Maple Mono</family>
        <family>Symbols Nerd Font</family>
        <family>JetBrainsMono</family>
        <family>Noto Mono</family>
        <family>Noto Color Emoji</family>
        <family>Noto Emoji</family>
        <family>Material Symbols Rounded</family>
        <family>Material Symbols Outlined</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>monospace</family>
        <prefer>
        <family>Maple Mono</family>
        <family>Symbols Nerd Font</family>
        <family>JetBrainsMono</family>
        <family>Noto Mono</family>
        <family>Noto Color Emoji</family>
        <family>Noto Emoji</family>
        <family>Material Symbols Rounded</family>
        <family>Material Symbols Outlined</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>system-ui</family>
        <prefer>
            <family>Maple Mono</family>
            <family>Symbols Nerd Font</family>
            <family>Noto Sans</family>
            <family>Noto Color Emoji</family>
            <family>Noto Emoji</family>
            <family>Material Symbols Rounded</family>
            <family>Material Symbols Outlined</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>mono-system-ui</family>
        <prefer>
            <family>Maple Mono</family>
            <family>Symbols Nerd Font</family>
            <family>JetBrainsMono</family>
            <family>Noto Mono</family>
            <family>Noto Color Emoji</family>
            <family>Noto Emoji</family>
            <family>Material Symbols Rounded</family>
            <family>Material Symbols Outlined</family>
        </prefer>
    </alias>
    <alias>
        <family>emoji</family>
        <prefer>
            <family>Google Android Emoji</family>
        </prefer>
    </alias>
</fontconfig>
