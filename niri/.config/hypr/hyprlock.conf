#*  Hyprlock Configuration File 

#* Hyprlock active layout path:
# Set the layout path to be used by Hyprlock.
# Check the available layouts in the './hyprlock/' directory.
# Example: /=/path/to/anurati
# Gruvbox Material (Hard) Color Scheme

$bg_dim=rgba(20,22,23,1)
$bg0=rgba(29,32,33,1)
$bg1=rgba(40,40,40,1)
$bg2=rgba(40,40,40,1)
$bg3=rgba(60,56,54,1)
$bg4=rgba(60,56,54,1)
$bg5=rgba(80,73,69,1)

$bg_statusline1=rgba(40,40,40,1)
$bg_statusline2=rgba(50,48,47,1)
$bg_statusline3=rgba(80,73,69,1)

$bg_diff_green=rgba(50,54,26,1)
$bg_visual_green=rgba(51,62,52,1)
$bg_diff_red=rgba(60,31,30,1)
$bg_visual_red=rgba(68,46,45,1)
$bg_diff_blue=rgba(13,49,56,1)
$bg_visual_blue=rgba(46,59,59,1)
$bg_visual_yellow=rgba(71,60,41,1)
$bg_current_word=rgba(50,48,47,1)

$fg0=rgba(226,204,169,1)
$fg1=rgba(226,204,169,1)

$red=rgba(242,89,75,1)
$orange=rgba(242,133,52,1)
$yellow=rgba(233,177,67,1)
$green=rgba(176,184,70,1)
$aqua=rgba(139,186,127,1)
$blue=rgba(128,170,158,1)
$purple=rgba(211,134,155,1)

$bg_red=rgba(219,71,64,1)
$bg_green=rgba(176,184,70,1)
$bg_yellow=rgba(233,177,67,1)

$grey0=rgba(124,111,100,1)
$grey1=rgba(146,131,116,1)
$grey2=rgba(168,153,132,1)

# Local Variables
$fontFamily = 0xProto Nerd Font Propo

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# BACKGROUND
background {
    monitor =
    color = $bg_dim
    path = $HOME/Pictures/wallpaper.png
    
    blur_passes = 1
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    grace = 0
    ignore_empty_input = true
    fractional_scaling = 1

    # immediate_render = true # turn off later

    hide_cursor = true
}


