# DATE
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = $fg0
    font_size = 25
    font_family = $fontFamily
    position = 0, 30
    halign = center
    valign = center
}

# USER Greeting
label {
    monitor =
    text = 
    color = $orange
    font_size = 24
    font_family = $fontFamily Bold
    position = -50, 263
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $USER
    color = $fg0
    font_size = 14
    font_family = $fontFamily Bold
    position = 20, 270
    halign = center
    valign = bottom
}

# Battery Status if present
label {
    monitor =
    text = cmd[update:5000] echo -e "$($HOME/.local/share/scripts/battery-info.sh icon+percentage)"
    color = $fg0
    font_size = 12
    font_family = $fontFamily
    position = -1%, -1.5%
    halign = right
    valign = top
}

# Current Keyboard Layout 
label {
    monitor =
    text = $LAYOUT
    color = $fg0
    font_size = 12
    font_family = $fontFamily
    position = -1%, 1.5%
    halign = right
    valign = bottom
}
