# $LOCKSCREEN = hyprlock # preferred LOCKSCREEN e.g swaylock

general {

    lock_cmd = killall hyprlock || hyprlock -q
    unlock_cmd = killall -q -s SIGUSR1 hyprlock

    before_sleep_cmd = hyprlock; sleep 2    # lock before suspend.
    after_sleep_cmd = niri msg action power-on-monitors;

    ignore_dbus_inhibit = false
    inhibit_sleep = 1
}

# Lock it first before dpms off so that screen won't show for a moment after wake up.
listener {
    timeout = 630
    on-timeout = hyprlock
}

# Dims the display
listener {
    timeout = 830
    on-timeout = { brightnessctl -s && brightnessctl s 1%; }
    on-resume = brightnessctl -r
}

# DPMS off
listener {
    timeout = 1050
    on-timeout = niri msg action power-off-monitors #do not turn off display while media is playing
    on-resume = niri msg action power-on-monitors
}

# Suspend
listener {
    timeout = 1500
    on-timeout = systemctl suspend
}

# hyprlang noerror true
