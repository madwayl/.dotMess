general {
    layout = scroller
}

plugin {
    scroller {
        # col.selection_border = rgba(9e1515ff)
        focus_wrap = false
        jump_labels_scale = 0.5
        gesture_overview_enable = false
        column_default_width = onehalf
        window_heights = onehalf one
        column_widths = onethird onehalf twothirds one
        window_default_height = one
        # ultra-wide monitor
        # column_widths = onesixth onefourth onethird onehalf one
        # portrait mode monitors
        monitor_modes = (DP-1 = (mode = row; column_default_width = onehalf; column_widths = onethird onehalf twothirds one; window_default_height = one; window_heights = onethird onehalf twothirds one;))
        
        gesture_workspace_switch_prefix = e
        # overview_scale_content = false
        # overview_render_layers = false
    }

    hyprfocus {
        enabled = yes
        animate_floating = yes
        animate_workspacechange = yes
        focus_animation = flash
        # Beziers for focus animations
        bezier = bezIn, 0.5,0.0,1.0,0.5
        bezier = bezOut, 0.0,0.5,0.5,1.0
        bezier = overshot, 0.05, 0.9, 0.1, 1.05
        bezier = smoothOut, 0.36, 0, 0.66, -0.56
        bezier = smoothIn, 0.25, 1, 0.5, 1
        bezier = realsmooth, 0.28,0.29,.69,1.08
        # Flash settings
        flash {
            flash_opacity = 0.875
            in_bezier = realsmooth
            in_speed = 0.5
            out_bezier = realsmooth
            out_speed = 5
        }
        # Shrink settings
        shrink {
            shrink_percentage = 0.98
            in_bezier = realsmooth
            in_speed = 1
            out_bezier = realsmooth
            out_speed = 2
        }
    }
}

gestures {
    # workspace_swipe = off
}

binds {
    allow_workspace_cycles = yes
}

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, KP_Home, scroller:movefocus, begin
bind = $mainMod, KP_End, scroller:movefocus, end

# Movement
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d
bind = $mainMod CTRL, KP_Home, scroller:movewindow, begin
bind = $mainMod CTRL, KP_End, scroller:movewindow, end

bind = $mainMod ALT, left, movewindow, l, nomode
bind = $mainMod ALT, right, movewindow, r, nomode
bind = $mainMod ALT, up, movewindow, u, nomode
bind = $mainMod ALT, down, movewindow, d, nomode
bind = $mainMod ALT, KP_Home, scroller:movewindow, begin, nomode
bind = $mainMod ALT, KP_End, scroller:movewindow, end, nomode

# window control
bind = $mainMod, bracketleft, scroller:setmode, row
bind = $mainMod, bracketright, scroller:setmode, col

# Pin
# bind = $mainMod Control, P, scroller:pin,

# Set Mode Modifiers submap
# will switch to a submap called modifiers
bind = $mainMod, backslash, submap, modifiers
# will start a submap called "modifiers"
submap = modifiers
bind = , right, scroller:setmodemodifier, after
bind = , right, submap, reset
bind = , left, scroller:setmodemodifier, before
bind = , left, submap, reset
bind = , up, scroller:setmodemodifier, beginning
bind = , up, submap, reset
bind = , down, scroller:setmodemodifier, end
bind = , down, submap, reset
bind = , period, scroller:setmodemodifier, focus
bind = , period, submap, reset
bind = , comma, scroller:setmodemodifier, nofocus
bind = , comma, submap, reset
bind = , 2, scroller:setmodemodifier,  auto:2
bind = , 2, submap, reset
bind = , 3, scroller:setmodemodifier, auto:3
bind = , 3, submap, reset
bind = , m, scroller:setmodemodifier, manual
bind = , m, submap, reset
bind = , c, scroller:setmodemodifier, center_column
bind = , c, submap, reset
bind = SHIFT, c, scroller:setmodemodifier, nocenter_column
bind = SHIFT, c, submap, reset
bind = , w, scroller:setmodemodifier, center_window
bind = , w, submap, reset
bind = SHIFT, w, scroller:setmodemodifier, nocenter_window
bind = SHIFT, w, submap, reset
# use reset to go back to the global submap
bind = , escape, submap, reset
# will reset the submap, meaning end the current one and return to the global one
submap = reset

bind = $mainMod, equal, scroller:cyclewidth, next
bind = $mainMod, minus, scroller:cyclewidth, prev
bind = $mainMod SHIFT, equal, scroller:cycleheight, next
bind = $mainMod SHIFT, minus, scroller:cycleheight, prev

