# See https://wiki.hyprland.org/Configuring/Animations/
# Edit or add animations in the ./hypr/animations/ directory
# and run the 'animations.sh --select' command to update this file

$ANIMATION_PATH=./animations/minimal-1.conf
source = $ANIMATION_PATH

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = myBezier, 0.10, 0.9, 0.1, 1.05

    animation = windows, 1, 5, myBezier, slide
    animation = windowsOut, 1, 5, myBezier, slide
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default

    bezier = fastLayer, 0.3, 1, 0.7, 1

    # Layer animations (like AGS bar, notifications)
    animation = layers, 1, 2, fastLayer, fade
    animation = layersIn, 1, 2, fastLayer, fade
    animation = layersOut, 1, 2, fastLayer, fade
}

misc {
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}